llm:
  provider: openai
  api_key: "sk-live-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJNZXRhQ2hhdCIsInN1YiI6IjY5N2NjZjY2Y2Y2YmQ3NTg5ZTNmMWZhOSIsImNsaWVudF9pZCI6ImUzOGNlMDVkY2Q5ZGZlODIyZGNjN2NkZTQ5Y2I2ZmNjIiwiaWF0IjoxNzY5Nzg3NTU5fQ.5CMTs2vEdnvhDlfkXgsSVn8gQZ6GdEDNWVzQUKZj2Jw"
  # api_key: "sk-f976c47739e6484fb8a2af8adb5628ee" 
  base_url: https://llm-api.mmchat.xyz/v1
  # base_url: https://api.deepseek.comz`
  model: "gemini-3-pro-preview"
  # model: "deepseek-reasoner"
  # deepseek-reasoner deepseek-chat
  temperature: 0.2
  max_output_tokens: 600

  # "打通结局"目标指令（目前没用上）
  goal_instruction: |
    You are playing a galgame.
    Use retrieved memory to stay consistent with earlier hints.

embedding:
  provider: qwen
  api_key: "sk-c9d043968b3f4e56a72451caa1665628"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "text-embedding-v4"
  dim: 1024
  use_real: false #暂时关闭embedding的生成

agent:
  max_steps: 721
  retrieve_top_k: 3
  verbose: true # 负责管理各项内容是否在控制台输出
  retriever_type: "vector"  # keyword or vector
  max_memory: 40  # 滑动窗口大小（已弃用）
  max_context_tokens: 65000  # 最大上下文token数
  # dpsk-chat 65000 gpt-5：272,000
  # 记忆压缩配置
  enable_compression: true  # 是否启用记忆压缩
  compression_threshold: 100  # 对话轮次超过此值时触发压缩
  compression_count: 80  # 每次压缩最早的n轮对话
  show_order_judgements_history: true  # 是否将所有历史排序判定展示给大模型
checkpoint:
  enabled: true  # 是否启用checkpoint功能
  interval: 20  # 每隔多少步保存一次checkpoint
  dir: "checkpoints"  # checkpoint保存目录
  resume_from: null
  # 恢复示例（取消注释以从checkpoint恢复）：
  # resume_from: "checkpoints/checkpoint_type_help_session_step_199.json"
  # resume_from: "checkpoints/checkpoint_dust_session_step_199.json"

env:
  game_type: "type_help"
  scenes_path: "dataset/type_help-en/nodes.json"
  start_node_id: "Background"
  test_language: "en"

  # game_type: "dust"
  # scenes_path: "dataset/The_dust_settles-en/nodes.json"
  # start_node_id: "start"
  # test_language: "en"
  enable_hint: true  # 是否启用失败次数提示功能
  hint_failure_threshold: 50  # 触发提示的连续失败次数阈值
  provide_naming_rules: false  # 是否在prompt中明确告知文件命名规则（[时间]-[地点]-[角色编号...]）
