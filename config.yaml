llm:
  provider: openai
  # api_key: "YOUR_API_KEY_HERE"           # Replace with your OpenAI-compatible API key
  # base_url: http://127.0.0.1:8000/v1     # Or e.g. https://api.openai.com/v1
  # model: gpt-4o                          # Model name, e.g. gpt-4o, qwen3-32b, deepseek-chat
  temperature: 0.2
  max_output_tokens: 600
  base_url: https://api.deepseek.com
  model: "deepseek-reasoner"
  api_key: "sk-f976c47739e6484fb8a2af8adb5628ee" 
  goal_instruction: |
    You are playing a galgame.
    Use retrieved memory to stay consistent with earlier hints.

judge_llm:
  provider: openai
  api_key: "sk-f976c47739e6484fb8a2af8adb5628ee"     # API key for the judge LLM (can be same as above)
  base_url: https://api.deepseek.com
  model: "deepseek-reasoner"
  temperature: 0.0
  max_output_tokens: 1024

embedding:
  provider: qwen
  api_key: "YOUR_EMBEDDING_API_KEY_HERE" # Replace with your embedding API key
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "text-embedding-v4"
  dim: 1024
  use_real: false  # Set to true to enable real-time embedding generation

agent:
  max_steps: 1
  retrieve_top_k: 3
  verbose: true
  retriever_type: "vector"   # "keyword" or "vector"
  max_context_tokens: 65000
  enable_compression: true   # Enable memory compression
  compression_threshold: 100 # Trigger compression after N turns
  compression_count: 80      # Compress earliest N turns each time

mem_agent:
  use_mem: false
  # To enable A-mem (local) or Mem0 (cloud), uncomment and configure:
  # mem_name: "a_mem"
  # use_mem: true
  # clear_on_start: false
  # amem_embedding_model: "all-MiniLM-L6-v2"
  # amem_llm_backend: "openai"
  # amem_llm_model: "gpt-4o-mini"

checkpoint:
  enabled: true
  interval: 20               # Save checkpoint every N steps
  dir: "checkpoints"
  resume_from: null
  # To resume from a checkpoint, uncomment and set the path:
  # resume_from: "checkpoints/checkpoint_type_help_session_step_39.json"

